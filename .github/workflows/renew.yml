name: FPS Auto Renew

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run server renew check
        env:
          FPS_SESSION_DATA: ${{ secrets.FPS_SESSION_DATA }}
        run: python renew.py

      - name: Upload server status screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-status
          path: server_status.png
          if-no-files-found: ignore
