name: FPS Auto Renew

on:
  workflow_dispatch:
  schedule:
    # يعمل تلقائياً كل رأس ساعة (Hourly)
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run server renew check
        env:
          FPS_SESSION_DATA: ${{ secrets.FPS_SESSION_DATA }}
        run: python renew.py

      - name: Upload server status screenshot & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-run-results
          path: |
            server_status.png
            renew_activity.log
          if-no-files-found: ignore
